<style>
:root{
  --bg:#f6f4ef;--card:#ffffff;--ink:#1c1b19;--mute:#5c5750;--line:#e6e1d8;--soft:#efeae1;
  --acc:#2f6f5e;--acc-ink:#ffffff;--acc-soft:#e3efea;--warn:#b4552e;--warn-soft:#f8e7df;--ok:#2f6f5e;--danger:#a83a2f;
  --gold:#a8843f;--shadow:0 6px 24px rgba(30,25,20,.08);--r:16px;--fs:16px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{--bg:#141412;--card:#1e1d1a;--ink:#f1ede6;--mute:#b5afa5;--line:#2e2c27;--soft:#26241f;--acc:#8fd0b8;--acc-ink:#0f1f19;--acc-soft:#1c2a25;--warn:#e8996f;--warn-soft:#3a271e;--danger:#ea7a6c;--ok:#8fd0b8;--shadow:0 6px 24px rgba(0,0,0,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141412;--card:#1e1d1a;--ink:#f1ede6;--mute:#b5afa5;--line:#2e2c27;--soft:#26241f;--acc:#8fd0b8;--acc-ink:#0f1f19;--acc-soft:#1c2a25;--warn:#e8996f;--warn-soft:#3a271e;--danger:#ea7a6c;--ok:#8fd0b8;--shadow:0 6px 24px rgba(0,0,0,.35)}}
:root[data-size="lg"]{--fs:18px}:root[data-size="xl"]{--fs:20px}
*{box-sizing:border-box}html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;line-height:1.45;padding-top:var(--sat)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
h1,h2,h3{margin:0 0 .4rem;line-height:1.2;font-weight:650}
h1{font-size:1.5rem}h2{font-size:1.15rem}h3{font-size:1rem}
.mute{color:var(--mute)}.small{font-size:.85rem}.tiny{font-size:.75rem}.right{text-align:right}.center{text-align:center}
.mono{font-variant-numeric:tabular-nums}
.money{font-variant-numeric:tabular-nums;font-weight:600}
.neg{color:var(--danger)}.pos{color:var(--ok)}
.hidden{display:none!important}
.sr{position:absolute;left:-9999px}
.lbl{display:block;font-size:.85rem;color:var(--mute);margin-bottom:4px}

/* layout */
#app{min-height:100vh;display:flex;flex-direction:column}
.shell{display:flex;flex:1;min-height:0}
.side{display:none}
.main{flex:1;max-width:760px;margin:0 auto;padding:12px 16px calc(84px + var(--sab));width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 10px}
.topbar h1{font-size:1.35rem}
.bottomnav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + var(--sab));z-index:20}
.bottomnav button{flex:1;background:none;border:0;padding:6px 2px;border-radius:10px;color:var(--ink);opacity:.75;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;cursor:pointer;min-height:48px}
.bottomnav button svg{width:22px;height:22px}
.bottomnav button.on{color:var(--acc);opacity:1}
@media (min-width:900px){
  .shell{gap:0}
  .side{display:flex;flex-direction:column;width:220px;padding:20px 12px;border-right:1px solid var(--line);background:var(--card);position:sticky;top:0;height:100vh;gap:2px}
  .side .brand{font-weight:700;padding:6px 10px 16px;font-size:1.05rem}
  .side button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:10px;color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:center;font-size:.95rem}
  .side button svg{width:20px;height:20px;color:var(--mute)}
  .side button.on{background:var(--acc-soft);color:var(--acc);font-weight:600}.side button.on svg{color:var(--acc)}
  .bottomnav{display:none}
  .main{padding:20px 28px 40px}
}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card h2{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hero{background:linear-gradient(160deg,var(--acc) 0%,color-mix(in srgb,var(--acc) 75%,#000) 100%);color:#fff;border:0}
:root[data-theme="dark"] .hero,:root:not([data-theme="light"]) .hero{color:#fff}
.hero .label{opacity:.85;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase}
.hero .big{font-size:2.6rem;font-weight:700;letter-spacing:-.02em;line-height:1.05;margin:.15rem 0 .3rem;font-variant-numeric:tabular-nums}
.hero .sub{opacity:.92;font-size:.95rem}
.hero .row{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
.hero .pill{background:rgba(255,255,255,.16);border-radius:999px;padding:4px 10px;font-size:.8rem}
.hero details{margin-top:10px}.hero summary{cursor:pointer;opacity:.9;font-size:.85rem}
.hero table{width:100%;font-size:.9rem;margin-top:6px;border-collapse:collapse}.hero td{padding:3px 0}.hero td:last-child{text-align:right;font-variant-numeric:tabular-nums}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);min-height:52px}
.item:last-child{border-bottom:0}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:.8rem;color:var(--mute)}
.item.click{cursor:pointer}
.emoji{width:38px;height:38px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex:none}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;background:var(--card);cursor:pointer}
.chk.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.bar>i.over{background:var(--warn)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--soft);border-radius:12px;padding:10px 12px}
.stat .k{font-size:.75rem;color:var(--ink);opacity:.75;text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-size:1.15rem;font-weight:650;font-variant-numeric:tabular-nums}

/* buttons */
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn.ghost{background:none;color:var(--acc);padding:8px 10px;min-height:36px}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.9rem}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.iconbtn{background:none;border:0;padding:8px;border-radius:10px;cursor:pointer;color:var(--mute);min-width:40px;min-height:40px}
.iconbtn:hover{background:var(--soft)}
.fab{position:fixed;right:18px;bottom:calc(76px + var(--sab));width:56px;height:56px;border-radius:50%;background:var(--acc);color:var(--acc-ink);border:0;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:1.8rem;cursor:pointer;z-index:19;display:flex;align-items:center;justify-content:center}
@media (min-width:900px){.fab{bottom:28px;right:28px}}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:10px;cursor:pointer;color:var(--ink);opacity:.8;font-size:.9rem;min-height:36px}
.seg button.on{background:var(--card);color:var(--ink);opacity:1;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.9rem;min-height:36px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}

/* forms */
.field{margin-bottom:12px}
.field label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:46px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.field .hint{font-size:.78rem;color:var(--mute);margin-top:3px}
.field.inline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.field.inline label{margin:0;color:var(--ink);font-size:1rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amount input{font-size:1.6rem;font-weight:650;text-align:center;font-variant-numeric:tabular-nums}
.switch{position:relative;width:46px;height:28px;background:var(--line);border-radius:99px;border:0;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on{background:var(--acc)}.switch.on::after{left:21px}
.err{color:var(--danger);font-size:.85rem;margin-top:4px}

/* sheet / modal */
.overlay{position:fixed;inset:0;background:rgba(20,18,14,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@media (min-width:700px){.overlay{align-items:center}}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;border-radius:20px 20px 0 0;padding:14px 18px calc(18px + var(--sab));overflow:auto;animation:up .2s}
@media (min-width:700px){.sheet{border-radius:20px;max-height:86vh}}
.sheet h2{display:flex;justify-content:space-between;align-items:center}
.sheet .foot{display:flex;gap:8px;margin-top:14px;position:sticky;bottom:0;background:var(--bg);padding-top:8px}
.sheet .foot .btn{flex:1}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--sab));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;z-index:40;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);max-width:92vw}
.toast button{background:none;border:0;color:var(--acc);font-weight:700;cursor:pointer;padding:4px}
@media (min-width:900px){.toast{bottom:28px}}
.banner{background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:12px;padding:10px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;font-size:.9rem}
.banner .btn{margin-left:auto}
.notice{background:var(--acc-soft);border-radius:12px;padding:10px 12px;font-size:.9rem;margin-bottom:12px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:.8rem}
.cal .dow{text-align:center;color:var(--mute);font-size:.7rem;padding:4px 0}
.cal .d{aspect-ratio:1;border-radius:10px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;position:relative;min-height:38px}
.cal .d.pad{background:none;cursor:default}
.cal .d.today{outline:2px solid var(--acc)}
.cal .d.sel{background:var(--acc);color:var(--acc-ink)}
.cal .dots{display:flex;gap:2px}.cal .dots i{width:5px;height:5px;border-radius:50%;background:var(--warn)}.cal .dots i.paid{background:var(--ok)}.cal .dots i.pay{background:var(--gold)}

/* charts */
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--mute);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}

/* onboarding / lock */
.wiz{max-width:520px;margin:0 auto;padding:24px 18px}
.wiz .steps{display:flex;gap:6px;margin-bottom:18px}.wiz .steps i{flex:1;height:4px;border-radius:99px;background:var(--line)}.wiz .steps i.on{background:var(--acc)}
.lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.lock .card{width:100%;max-width:380px;text-align:center}
.pin{font-size:1.6rem;letter-spacing:.4em;text-align:center}
.help h3{margin-top:18px}
.help ol,.help ul{padding-left:20px}.help li{margin:4px 0}
kbd{background:var(--soft);border-radius:6px;padding:1px 6px;font-size:.85em;border:1px solid var(--line)}
table.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
table.tbl th{text-align:left;color:var(--mute);font-weight:500;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;padding:6px 4px;border-bottom:1px solid var(--line)}
table.tbl td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.tbl td.num,table.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--mute);padding:26px 10px}
.empty .big{font-size:2rem}
@media print{.bottomnav,.fab,.side,.topbar button{display:none!important}.main{padding:0;max-width:none}.card{box-shadow:none;break-inside:avoid}}

/* ---- AlphaNumz bookkeeping additions ---- */
.pos{color:var(--ok)}
.hero{background:linear-gradient(160deg,var(--acc) 0%,color-mix(in srgb,var(--acc) 72%,#000) 100%)}
.topbar{flex-wrap:wrap}.tb-right{display:flex;gap:6px;flex-wrap:wrap}
.topbar h1{min-width:0;overflow-wrap:anywhere}
.periodbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.fynav{display:flex;align-items:center;gap:2px;margin-left:auto}
.seg.wrap{flex-wrap:wrap}
.kpis{margin-bottom:12px}.kpis .stat .v{font-size:1.05rem}
.stat .tiny{color:var(--mute)}
.card.click{cursor:pointer}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:.72rem;font-weight:600;background:var(--soft);color:var(--ink);vertical-align:middle;white-space:nowrap}
.pill.paid{background:var(--acc-soft);color:var(--acc)}.pill.sent,.pill.info{background:var(--info-soft);color:var(--ink)}
.pill.overdue{background:var(--warn-soft);color:var(--warn)}.pill.draft{background:var(--soft);color:var(--mute)}
.item .right{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.item.morebtn{width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;font:inherit;color:inherit}
.emoji.income{color:var(--ok);font-weight:700}.emoji.expense{color:var(--warn);font-weight:700}.emoji.transfer{color:var(--mute)}
.bar.exp>i{background:var(--acc2)}
.chip.static{display:inline-flex;align-items:center;gap:4px;padding-right:4px;cursor:default}
.chip .x{border:0;background:none;font-size:1.1rem;line-height:1;padding:2px 6px;cursor:pointer;color:var(--mute);min-width:28px;min-height:28px}
.chip.add{border-style:dashed}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
.tblwrap:focus{outline:2px solid var(--acc);outline-offset:2px}
table.pnl th[scope=row]{font-weight:500;text-align:left;white-space:nowrap;padding:6px 8px 6px 0;border-bottom:1px solid var(--line);color:var(--ink);font-size:.85rem;text-transform:none;letter-spacing:0}
table.pnl td{white-space:nowrap}
table.pnl tr.sec th{padding-top:12px;color:var(--mute);font-size:.75rem;text-transform:uppercase;letter-spacing:.04em}
table.pnl tr.sub th,table.pnl tr.sub td,table.pnl tr.net th,table.pnl tr.net td{font-weight:650}
table.pnl tr.net th,table.pnl tr.net td{border-top:2px solid var(--ink)}
table.tbl td.tot{font-weight:600}
table.breakdown td{padding:5px 2px}table.breakdown tr.total td{font-weight:700;border-top:2px solid var(--ink)}
.brandcard{display:flex;gap:12px;align-items:center}.brandlogo{border-radius:10px;flex:none;width:44px;height:44px}
.brandlogo.sm{width:28px;height:28px;border-radius:7px}
.brandname{font-weight:750;font-size:1.05rem;letter-spacing:-.01em}
.side .brand{display:flex;align-items:center;gap:8px}
.lines .line{border:1px solid var(--line);border-radius:12px;padding:10px 10px 0;margin-bottom:8px;background:var(--card)}
.line-nums{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;align-items:end}.line-nums .iconbtn{margin-bottom:14px}
.totalrow{display:flex;justify-content:space-between;font-size:1.15rem;padding:10px 2px;border-top:2px solid var(--ink);margin:6px 0 12px}
.docwrap{background:#fff;color:#1c1b19;border:1px solid var(--line);border-radius:12px;padding:14px;overflow-x:auto}
.selbar{position:fixed;left:0;right:0;bottom:calc(64px + var(--sab));display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;z-index:21}
@media (min-width:900px){.selbar{left:220px;bottom:0}}
.bulk{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.bulkhead,.bulkrow{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:6px;align-items:center}
.bulkrow input{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px;min-height:42px;background:var(--card)}
code{background:var(--soft);padding:1px 4px;border-radius:4px;font-size:.85em;overflow-wrap:anywhere}
.acctrow .field input{min-width:0}
/* invoice + year summary document (screen preview and print) */
.invdoc{font-size:14px;line-height:1.45;color:#1c1b19}
.invdoc .doc-head{display:flex;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.invdoc .doc-biz{font-size:1.25rem;font-weight:700}.invdoc .doc-biz2{font-weight:650}
.invdoc .doc-meta{text-align:right}.invdoc .doc-title{font-size:1.4rem;font-weight:800;letter-spacing:.08em;color:#1C2A4A}
.invdoc .doc-paid{display:inline-block;margin-top:4px;border:2px solid #1f6b45;color:#1f6b45;font-weight:800;padding:1px 8px;border-radius:6px}
.invdoc .doc-k{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:#5c5750}
.invdoc .doc-to{margin-bottom:16px}
.invdoc h3{margin:16px 0 6px;font-size:1rem}
.doc-tbl{width:100%;border-collapse:collapse}
.doc-tbl th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:#5c5750;border-bottom:2px solid #1c1b19;padding:6px 4px}
.doc-tbl td{padding:7px 4px;border-bottom:1px solid #ddd}
.doc-tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.doc-tbl tfoot td{font-weight:800;font-size:1.05rem;border-bottom:0;border-top:2px solid #1c1b19}
.doc-tbl tr.sec td{font-weight:700;padding-top:12px;border-bottom:1px solid #1c1b19}
.doc-tbl tr.sub td{font-weight:650}.doc-tbl tr.net td{font-weight:800;border-top:2px solid #1c1b19}
.invdoc .doc-notes{margin-top:14px;white-space:pre-wrap}
.invdoc .doc-foot{margin-top:22px;padding-top:8px;border-top:1px solid #ddd;color:#5c5750;font-size:.85rem;white-space:pre-wrap}
#printroot{display:none}
@media print{
  body.printing > *:not(#printroot){display:none!important}
  body.printing #printroot{display:block}
  body.printing{background:#fff;padding:0}
  .invdoc{font-size:11pt}
}
.hero .pill{background:rgba(255,255,255,.18);color:#fff;font-size:.8rem;padding:4px 10px;font-weight:600}
.row2>*{min-width:0}.field input,.field select{min-width:0;max-width:100%}

/* ---- typography ---- */
h1,h2,.brandname,.side .brand .pname{font-family:var(--f-head);font-weight:600;letter-spacing:.03em}
h1{font-size:1.45rem}h2{font-size:1.02rem}
.topbar h1{font-size:1.3rem;display:flex;align-items:center;gap:10px}
.display{font-family:var(--f-disp);font-weight:600;letter-spacing:.01em}
.display.i{font-style:italic;font-weight:500}
.kfig{font-family:var(--f-disp);font-weight:600;font-size:1.55rem;line-height:1.05;font-variant-numeric:lining-nums tabular-nums}
.stat .v{font-family:var(--f-disp);font-size:1.4rem;font-weight:600;font-variant-numeric:lining-nums tabular-nums}
.stat .k{font-size:.72rem;letter-spacing:.08em}
.gold{color:var(--gold)}
a{color:var(--acc)}

/* ---- ornament: double-rule frame, gold hairline under section titles, corner flourishes ---- */
.card{border:1px solid var(--rule-soft);box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px var(--line),var(--shadow);padding:18px}
.card.flat{box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px var(--line)}
.card>h2{padding-bottom:8px;margin-bottom:12px;background:linear-gradient(var(--rule),var(--rule)) left bottom/56px 1px no-repeat}
.sheet h2{font-size:1.05rem}
.hero{position:relative;background:var(--hero);color:var(--hero-ink);border:1px solid var(--hero-gold);box-shadow:inset 0 0 0 4px var(--hero),inset 0 0 0 5px color-mix(in srgb,var(--hero-gold) 55%,transparent),var(--shadow);overflow:hidden;padding:22px 20px}
:root[data-theme="dark"] .hero,:root:not([data-theme="light"]) .hero{color:var(--hero-ink)}
.hero .gold,.hero .label{color:var(--hero-accent,var(--hero-gold))}
.hero .label{opacity:1;letter-spacing:.14em}
.flourish{position:absolute;width:44px;height:44px;color:var(--hero-gold);pointer-events:none;opacity:.9}
.flourish.tl{top:8px;left:8px}.flourish.tr{top:8px;right:8px;transform:scaleX(-1)}.flourish.bl{bottom:8px;left:8px;transform:scaleY(-1)}.flourish.br{bottom:8px;right:8px;transform:scale(-1,-1)}
.card .flourish{color:var(--rule);width:34px;height:34px;opacity:.75}
.rule-orn{display:block;margin:6px auto;color:var(--hero-gold)}
.card .rule-orn{color:var(--rule)}

/* ---- monogram ---- */
.monogram{display:block;flex:none}
.monogram text{font-family:var(--f-disp);font-weight:500}
.monogram .mg-ring{stroke:var(--mg-ring,currentColor)}.monogram .mg-dot{fill:var(--mg-ring,currentColor)}
.bar>i:not(.over){background:var(--prog,var(--acc))}
.topbar .monogram{width:34px;height:34px;color:var(--acc)}
.homehead{text-align:center;padding:26px 16px 22px}
.homehead .monogram{margin:0 auto 6px;width:88px;height:88px;color:var(--hero-num,var(--hero-gold))}
.homehead .names{font-family:var(--f-disp);font-weight:600;font-size:2.1rem;line-height:1.1;margin:4px 0 2px}
.homehead .names i{font-style:italic;font-weight:500;color:var(--hero-accent,var(--hero-gold));padding:0 .15em}
.homehead .when{font-size:.9rem;letter-spacing:.12em;text-transform:uppercase;opacity:.95}
.homehead .count{font-family:var(--f-disp);font-size:1.25rem;margin-top:10px}
.homehead .count b{font-size:2.4rem;font-weight:600;color:var(--hero-num,var(--hero-gold));display:block;line-height:1;font-variant-numeric:lining-nums}

/* ---- budget ring ---- */
.ringwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{flex:none}
.ring .trk{stroke:var(--soft)}.ring .com{stroke:var(--rule-soft)}.ring .pd{stroke:var(--ring-pd,var(--acc))}.ring .ovr{stroke:var(--warn)}
.ring text{fill:var(--ink);font-family:var(--f-disp);font-weight:600}
.ringlegend{flex:1;min-width:180px}
.ringlegend .kv{border-bottom:1px dashed var(--line)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.dot.pd{background:var(--acc)}.dot.com{background:var(--rule-soft);border:1px solid var(--rule)}.dot.trk{background:var(--soft);border:1px solid var(--line)}

/* ---- lists and rows ---- */
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:.92rem;border-bottom:1px dashed var(--line)}.kv:last-child{border-bottom:0}.kv span:last-child{text-align:right;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.attn+.attn{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.attn h3{margin:0 0 2px;font-size:.95rem}
.attn .item{min-height:44px;padding:6px 0}
.rsvprow{padding:8px 0;border-bottom:1px solid var(--line)}.rsvprow:last-child{border-bottom:0}
.rsvprow .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.stack{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--soft);margin-top:6px}
.stack i{display:block;height:100%}.stack i.y{background:var(--prog,var(--acc))}.stack i.n{background:var(--mute)}
.linkish{background:none;border:0;padding:0;margin:0;text-align:left;font:inherit;color:inherit;cursor:pointer;min-width:0}
.linkish .t,.linkish .s{display:block}
.pill.ok{background:var(--acc-soft);color:var(--ink)}.pill.warn,.pill.overdue{background:var(--warn-soft);color:var(--warn)}.pill.gold{background:var(--soft);color:var(--gold)}
.pill.yes{background:var(--acc-soft);color:var(--ink)}.pill.no{background:var(--soft);color:var(--mute)}.pill.pending{background:var(--warn-soft);color:var(--ink)}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:600px){.counts{grid-template-columns:repeat(6,1fr)}}
.counts .stat{text-align:center;padding:8px 6px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.filters .field{margin:0;flex:1;min-width:140px}
.hhcard .hhhead{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.hhcard .hhhead .linkish .t{font-weight:650;font-size:1.02rem}
.person{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.person .grow{flex:1;min-width:140px}
.person .nm{font-weight:550}
.rsvp{display:inline-flex;background:var(--soft);border-radius:10px;padding:2px;gap:2px;flex:none}
.rsvp button{border:0;background:none;border-radius:8px;padding:5px 9px;min-height:34px;font-size:.8rem;cursor:pointer;color:var(--ink)}
.rsvp button.on.yes{background:var(--acc);color:var(--acc-ink);font-weight:650}
.rsvp button.on.no{background:var(--mute);color:var(--card);font-weight:650}
.rsvp button.on.pending{background:var(--card);color:var(--ink);font-weight:650;box-shadow:0 0 0 1px var(--line)}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.swatches{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:600px){.swatches{grid-template-columns:repeat(4,1fr)}}
.swatch{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:44px;color:var(--ink)}
.swatch.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.swatch .chipset{display:flex;gap:0}.swatch .chipset i{width:26px;height:26px;border-radius:50%;border:2px solid var(--card);margin-right:-6px;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.swatch span{font-size:.85rem;font-weight:600}
.stars{display:inline-flex;gap:1px;color:var(--gold)}
.stars svg{width:15px;height:15px}.stars .off{color:var(--line)}
.starpick{display:flex;gap:4px}.starpick button{background:none;border:0;cursor:pointer;color:var(--line);padding:4px;min-width:36px;min-height:36px}.starpick button.on{color:var(--gold)}
.starpick button svg{width:24px;height:24px}
.vcard .vtop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.contact{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.task{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);min-height:48px}.task:last-child{border-bottom:0}
.task .grow{flex:1;min-width:0}.task .t{font-weight:550}.task.done .t{text-decoration:line-through;color:var(--mute)}
.task .s{font-size:.8rem;color:var(--mute)}
.chk{width:28px;height:28px}
.tl{display:grid;grid-template-columns:62px 1fr;gap:0 12px}
.tl .time{font-family:var(--f-disp);font-weight:600;font-size:1.15rem;padding:10px 0;border-bottom:1px solid var(--line);font-variant-numeric:lining-nums tabular-nums}
.tl .what{padding:10px 0;border-bottom:1px solid var(--line)}
.tl .what .s{font-size:.8rem;color:var(--mute)}
.monthhead{font-family:var(--f-head);font-size:.85rem;letter-spacing:.08em;color:var(--gold);margin:14px 0 2px}
.segscroll{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.seg{flex-wrap:wrap}

/* ---- seating ---- */
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px var(--line)}
.tcard.over{border-color:var(--warn)}
.tcard.drop{outline:2px dashed var(--acc);outline-offset:2px}
.tcard .thead{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:6px}
.tcard h3{margin:0;font-family:var(--f-disp);font-size:1.15rem;font-weight:600}
.cap{font-size:.78rem;font-weight:700;border-radius:99px;padding:2px 8px;background:var(--acc-soft);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.cap.full{background:var(--soft);color:var(--ink)}.cap.over{background:var(--warn-soft);color:var(--warn)}
.pchips{display:flex;flex-wrap:wrap;gap:5px}
.pchip{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:99px;padding:4px 10px;font-size:.82rem;cursor:pointer;min-height:32px}
.pchip.sel{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.pchip[draggable="true"]{cursor:grab}
.seathere{margin-top:8px;width:100%}
.selbar{position:fixed;left:0;right:0;bottom:calc(64px + var(--sab));display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--card);border-top:2px solid var(--rule);padding:10px 16px;z-index:21;box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.selbar .grow{flex:1;min-width:150px;font-size:.9rem}
@media (min-width:900px){.selbar{left:220px;bottom:0}}
.warnlist .item{min-height:40px}

/* ---- sidebar / nav in the royal look ---- */
.side .brand{flex-direction:row}
.side .brand .pname{font-size:.95rem}
.side button.on{background:var(--acc-soft);color:var(--ink)}.side button.on svg{color:var(--ink)}
.bottomnav{border-top:1px solid var(--rule-soft)}
.bottomnav button.on{color:var(--ink);font-weight:700}
.bottomnav button.on svg{color:var(--acc)}
.fab{box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--rule),0 8px 22px rgba(0,0,0,.2)}
.btn{border-radius:10px}
.btn.danger{color:var(--danger-ink)}
.wiz h1{font-size:1.5rem}
.wiz .steps i.on{background:var(--rule)}
.wiz .lead{font-family:var(--f-disp);font-size:1.2rem;font-style:italic}
.chip.on{background:var(--acc);color:var(--acc-ink)}
.stepcount{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600}
.namepair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.namepair>*{min-width:0}
.empty .big{color:var(--rule);font-size:1rem;margin-bottom:6px}
.aboutcard{text-align:center}.aboutcard .brandlogo{margin:0 auto 8px;display:block;width:64px;height:64px;border-radius:14px}
.aboutcard .brandname{font-size:1.3rem}
.small.center{text-align:center}

/* ---- printable documents ---- */
.pdoc{font-size:11pt;line-height:1.4;color:#1c1b19;background:#fff}
.pdoc .phead{text-align:center;margin-bottom:14px;border-bottom:1px solid #C9A84C;padding-bottom:10px}
.pdoc .phead .names{font-family:var(--f-disp);font-size:22pt;font-weight:600;margin:0}
.pdoc .phead .ptitle{font-family:var(--f-head);font-size:12pt;letter-spacing:.12em;color:#5a4a18;margin-top:2px}
.pdoc .phead .psub{font-size:9.5pt;color:#555}
.pdoc h3{font-family:var(--f-head);font-size:11pt;letter-spacing:.06em;margin:14px 0 6px;color:#1C2A4A}
.pdoc table{width:100%;border-collapse:collapse;font-size:9.5pt}
.pdoc th{text-align:left;font-size:8pt;text-transform:uppercase;letter-spacing:.06em;color:#555;border-bottom:1.5px solid #1c1b19;padding:4px}
.pdoc td{padding:4px;border-bottom:1px solid #ddd;vertical-align:top}
.pdoc .tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pdoc .tbox{border:1px solid #C9A84C;border-radius:6px;padding:8px;break-inside:avoid}
.pdoc .tbox h4{margin:0 0 4px;font-family:var(--f-disp);font-size:13pt}
.pdoc .tbox div{font-size:9.5pt}
.pdoc .addr{break-inside:avoid;padding:8px 0;border-bottom:1px solid #ddd;font-size:10.5pt}
.pdoc .addrgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.pdoc .pfoot{margin-top:16px;font-size:8.5pt;color:#666;border-top:1px solid #ddd;padding-top:6px}
.docwrap{background:#fff;color:#1c1b19}
@media print{.selbar,.toast{display:none!important}}
.segscroll .seg{flex-wrap:nowrap;white-space:nowrap}
h2 .btn,h2 a,h2 .small{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;letter-spacing:0}
.kv span:last-child{white-space:nowrap}.kv span:first-child{min-width:0}
@media (min-width:900px){.main:has(.seatgrid){max-width:1100px}.seatgrid{display:grid;grid-template-columns:260px 1fr;gap:12px;align-items:start}.seatgrid #unseated{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;margin:0}}
/* demo mode banner: slim, on every screen, gold hairline */
.demobar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);color:var(--ink);border:1px solid var(--rule-soft);border-bottom:2px solid var(--rule);border-radius:12px;padding:6px 8px 6px 14px;margin:0 0 10px;font-size:.9rem}
.demobar .grow{flex:1;min-width:150px}.demobar b{color:var(--gold);font-family:var(--f-head);font-weight:600;letter-spacing:.04em}
@media print{.demobar{display:none!important}}
